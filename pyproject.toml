[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rotcert"
version = "0.3.0"
description = "Geometry-aware conformal localization and diagnostic reliability auditing for oriented object detection."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "shapely>=2.0",
]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rotcert = "rotcert.cli:main"

[tool.setuptools]
packages = ["rotcert", "rotcert._vendor", "rotcert._vendor.relmetrics"]

[tool.setuptools.package-data]
"rotcert._vendor.relmetrics" = ["LICENSE", "README.md"]
