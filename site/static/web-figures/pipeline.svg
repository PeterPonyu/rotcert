<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="t d">
  <title id="t">RotCert certificate pipeline</title>
  <desc id="d">Input oriented box, sealed detector, match, GWD score, then G1 green fork, G2 orange fork, and a dashed refuse gate.</desc>
  <rect width="960" height="220" fill="#F7F5F0"/>
  <g font-family="Source Sans 3, Segoe UI, sans-serif" font-size="13" fill="#111111" text-anchor="middle">
    <rect x="20" y="80" width="110" height="60" fill="#FFFcf6" stroke="#111111"/>
    <text x="75" y="115">Input OBB</text>
    <rect x="160" y="80" width="120" height="60" fill="#FFFcf6" stroke="#111111"/>
    <text x="220" y="115">Sealed detector</text>
    <rect x="310" y="80" width="130" height="60" fill="#FFFcf6" stroke="#111111"/>
    <text x="375" y="107">Match</text>
    <text x="375" y="125">rot-IoU e 0.5</text>
    <rect x="470" y="80" width="110" height="60" fill="#FFFcf6" stroke="#0072B2"/>
    <text x="525" y="115">GWD score</text>
    <rect x="620" y="28" width="140" height="56" fill="#FFFcf6" stroke="#007A00" stroke-width="2"/>
    <text x="690" y="60" fill="#007A00">G1 localization</text>
    <rect x="620" y="136" width="140" height="56" fill="#FFFcf6" stroke="#D55E00" stroke-width="2"/>
    <text x="690" y="168" fill="#D55E00">G2 recall</text>
    <rect x="800" y="70" width="140" height="80" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="870" y="115">Refuse gate</text>
  </g>
  <g stroke="#111111" stroke-width="1.4" fill="none">
    <line x1="130" y1="110" x2="160" y2="110"/>
    <line x1="280" y1="110" x2="310" y2="110"/>
    <line x1="440" y1="110" x2="470" y2="110"/>
    <line x1="580" y1="110" x2="600" y2="110"/>
    <line x1="600" y1="110" x2="600" y2="56"/>
    <line x1="600" y1="56" x2="620" y2="56"/>
    <line x1="600" y1="110" x2="600" y2="164"/>
    <line x1="600" y1="164" x2="620" y2="164"/>
    <line x1="760" y1="56" x2="800" y2="100"/>
    <line x1="760" y1="164" x2="800" y2="120"/>
  </g>
</svg>
