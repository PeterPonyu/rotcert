[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rotcert"
version = "0.1.0.dev0"
description = "Angle-aware GWD-based conformal certification for oriented object detection (DOTA + DIOR-R) -- a thin wrapper over relmetrics."
requires-python = ">=3.9"
dependencies = [
    "relmetrics>=0.1",
    "numpy>=1.22",
    "scipy>=1.8",
    "shapely>=2.0",
]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rotcert = "rotcert.cli:main"

[tool.setuptools]
packages = ["rotcert"]
